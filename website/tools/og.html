<!-- The 1200x630 sharing card: the hero on a white page, the Tide window showing the night page, flat glass so headless renders are faithful.
     Render: PLAYWRIGHT_BROWSERS_PATH=… node shot.mjs file://…/tools/og.html <out> --engine chromium --w 1200 --h 630 --steps 1 --dark --wait 1500
     then copy the PNG to src/img/og-home.png. -->
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<title>Artemis sharing card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body {
    position: relative;
    color: #161616;
    font: 400 14px/1.2 system-ui, -apple-system, "Helvetica Neue", sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .win {
    position: absolute; left: 72px; right: 72px; top: 196px; height: 520px; overflow: hidden; color: #fff;
    border-radius: 16px; background: #0d214c url("../assets/spaces/space-tide-880x592.png") 0 0 / 100% 100%;
    box-shadow: 0 0 0 0.5px rgb(0 0 0 / 0.2), 0 24px 64px -8px rgb(0 0 0 / 0.3), 0 8px 20px -6px rgb(0 0 0 / 0.16);
  }
  .gl { display: block; flex: none; width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; color: rgb(255 255 255 / 0.8); }
  .g {
    position: relative;
    background: rgb(255 255 255 / 0.12);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.28), inset 0 0 0 0.5px rgb(255 255 255 / 0.14), inset 0 -1px 1px rgb(0 0 0 / 0.12), 0 4px 14px rgb(0 0 0 / 0.18);
  }
  .lit { background: rgb(255 255 255 / 0.16); }
  .lockup { position: absolute; top: 64px; left: 72px; right: 72px; display: flex; align-items: center; gap: 22px; }
  .lockup img { width: 76px; height: 76px; }
  h1 { font: 600 60px/1.04 system-ui, -apple-system, sans-serif; letter-spacing: -0.015em; }
  .sb { position: absolute; left: 12px; top: 8px; width: 236px; }
  .toprow { position: relative; height: 36px; }
  .tl { position: absolute; top: 11px; width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.22); }
  .tl.c { left: 0; background: #ff5f57; }
  .tl.m { left: 23px; background: #febc2e; }
  .tl.z { left: 46px; background: #28c840; }
  .circ { position: absolute; top: 0; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
  .circ .gl { width: 14px; height: 14px; }
  .toggle { left: 70px; }
  .back { left: 158px; }
  .reload { left: 200px; }
  .defs { position: absolute; width: 0; height: 0; }
  .url { margin-top: 10px; height: 36px; border-radius: 18px; padding: 0 7px 0 14px; display: flex; align-items: center; gap: 2px; }
  .url .dom { flex: 1; font-size: 13px; color: rgb(255 255 255 / 0.9); }
  .url .gl { width: 22px; height: 13px; }
  .favs { margin-top: 8px; display: flex; gap: 5px; }
  .fav { flex: 1; height: 48px; border-radius: 10px; display: grid; place-items: center; background: rgb(255 255 255 / 0.06); }
  .fi { display: block; flex: none; width: 16px; height: 16px; border-radius: 4px; background: 0 0 / 100% 100% no-repeat; }
  .fav .fi { width: 20px; height: 20px; border-radius: 5px; }
  .fi-lowlight { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' rx='5' fill='%23101112'/><path fill='%23ECECEC' d='M15.8 11.75A6 6 0 1 1 8.25 4.2a6.07 6.07 0 0 0 7.55 7.55Z'/></svg>"); }
  .fi-slowloaf { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' rx='5' fill='%23F3E3C6'/><path fill='%23C98A4B' d='M3.8 13C3.8 8.9 6.6 6.2 10 6.2s6.2 2.7 6.2 6.8v.6c0 .8-.6 1.4-1.4 1.4H5.2c-.8 0-1.4-.6-1.4-1.4Z'/><path d='m7.4 9.4 1.3 1.7m1.7-2.5 1.3 1.7' stroke='%23F3E3C6' stroke-width='1.1' stroke-linecap='round'/></svg>"); }
  .fi-plot { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' rx='5' fill='%233F9D5A'/><path fill='%23D9F7C8' d='M15.6 4.4C9.4 4.4 5.6 7.2 5.6 11.2c0 1 .3 1.8.7 2.4l-1.6 1.6.8.8 1.6-1.6c.6.4 1.4.7 2.4.7 4.2 0 6.1-4.4 6.1-10.7Z'/></svg>"); }
  .shead { margin-top: 8px; height: 36px; padding-left: 11px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: rgb(255 255 255 / 0.7); }
  .shead .gl { width: 13px; height: 13px; color: #3b73eb; }
  .row { height: 36px; margin-top: 5px; border-radius: 10px; padding: 0 7px 0 11px; display: flex; align-items: center; gap: 8px; }
  .row.new { color: rgb(255 255 255 / 0.7); }
  .row.new .gl { width: 12px; height: 12px; stroke-width: 2.9; }
  .pin-line { height: 1px; margin: 10px 4px; border: 0; background: rgb(255 255 255 / 0.12); }
  .card {
    position: absolute; left: 262px; right: 10px; top: 10px; bottom: 10px;
    border-radius: 10px; overflow: hidden; background: #101112; color: #ececec;
    box-shadow: 0 3px 24px rgb(0 0 0 / 0.35);
  }
  .mast { height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; border-bottom: 1px solid rgb(255 255 255 / 0.1); font: 600 20px/1 "Iowan Old Style", Palatino, Georgia, serif; }
  .mast .gl { width: 14px; height: 14px; color: #ececec; }
  .fig { position: relative; height: 310px; background: linear-gradient(180deg, #04060b, #0a0f1a 70%, #0e1522); overflow: hidden; }
  .fig .st { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fig .con { position: absolute; left: 50%; top: 10px; width: 374px; height: 288px; translate: -50% 0; }
  .fig .hz { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 22px; }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true">

<symbol id="i-tune" viewBox="0 0 16 12"><path d="M1 3h7.1M13.4 3H15M1 9h1.5M7.8 9H15M13.35 3a2.6 2.6 0 1 1-5.2 0 2.6 2.6 0 1 1 5.2 0ZM7.75 9a2.6 2.6 0 1 1-5.2 0 2.6 2.6 0 1 1 5.2 0Z"/></symbol>
<symbol id="orion" viewBox="0 0 520 400"><g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.1"><path d="M193 76 278 34 321 95 291 207 274 223 253 235 193 76M253 235l-30 132M291 207l74 135"/></g><circle cx="278" cy="295" r="17" fill="url(#g-neb)"/><circle cx="193" cy="76" r="15" fill="url(#g-betel)"/><circle cx="365" cy="342" r="17" fill="url(#g-rigel)"/><g fill="url(#g-star)"><circle cx="321" cy="95" r="9"/><circle cx="278" cy="34" r="7"/><circle cx="291" cy="207" r="9"/><circle cx="274" cy="223" r="10"/><circle cx="253" cy="235" r="9.5"/><circle cx="223" cy="367" r="8.5"/><circle cx="275" cy="277" r="4.5"/><circle cx="280" cy="311" r="4"/></g><g font-family="system-ui,-apple-system,sans-serif" font-size="12" letter-spacing=".02em"><text x="171" y="80" text-anchor="end" fill="#e8a77c">Betelgeuse</text><text x="339" y="99" fill="#fff" fill-opacity=".6">Bellatrix</text><text x="311" y="217" fill="#fff" fill-opacity=".6">The belt</text><text x="386" y="346" fill="#cfe0f5">Rigel</text><text x="202" y="371" text-anchor="end" fill="#fff" fill-opacity=".6">Saiph</text></g></symbol>

<div class="lockup">
  <img src="../src/img/icon-rigel-light-192.png" width="76" height="76" alt="" />
  <h1>A native browser for&nbsp;your&nbsp;Mac.</h1>
</div>
<div class="win">
  <div class="sb">
    <div class="toprow">
      <i class="tl c"></i><i class="tl m"></i><i class="tl z"></i>
      <span class="g circ toggle"><svg class="gl"><use href="#i-sidebar" /></svg></span>
      <span class="g circ back"><svg class="gl"><use href="#i-chev-l" /></svg></span>
      <span class="g circ reload"><svg class="gl"><use href="#i-reload" /></svg></span>
    </div>
    <div class="g url"><span class="dom">lowlight.press</span><svg class="gl"><use href="#i-link" /></svg><svg class="gl" viewBox="0 0 16 12"><use href="#i-tune" /></svg></div>
    <div class="favs">
      <span class="g fav lit"><i class="fi fi-lowlight"></i></span><span class="g fav"><i class="fi fi-slowloaf"></i></span><span class="g fav"><i class="fi fi-plot"></i></span>
    </div>
    <div class="shead"><svg class="gl"><use href="#i-moon" /></svg>Personal</div>
    <div class="row"><i class="fi fi-slowloaf"></i>Recipes to try</div>
    <div class="row"><i class="fi fi-lowlight"></i>Reading list</div>
    <hr class="pin-line" />
    <div class="row new"><svg class="gl"><use href="#i-plus" /></svg>New Tab</div>
    <div class="row g lit"><i class="fi fi-lowlight"></i>Orion, star by star</div>
    <div class="row"><i class="fi fi-lowlight"></i>Sky tonight</div>
  </div>
  <div class="card">
    <div class="mast"><svg class="gl"><use href="#i-moon" /></svg>Low Light</div>
    <div class="fig">
      <svg class="st" viewBox="0 0 1440 470" preserveAspectRatio="xMidYMid slice"><use href="#stars-1440" /></svg>
      <svg class="con" viewBox="0 0 520 400"><use href="#orion" /></svg>
      <svg class="hz" viewBox="0 0 1440 28" preserveAspectRatio="none"><use href="#horizon" /></svg>
    </div>
  </div>
</div>
</body>
</html>
