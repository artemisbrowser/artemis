<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<meta
  name="theme-color"
  media="(prefers-color-scheme: light)"
  content="#ffffff"
/>
<meta
  name="theme-color"
  media="(prefers-color-scheme: dark)"
  content="#000000"
/>
<link rel="icon" href="/favicon.ico" sizes="32x32" />
