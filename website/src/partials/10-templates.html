<template id="peek-mac">
  <h2 id="peek-title">What stays on your Mac</h2>
  <ul class="peek-list">
    <li>There’s no account and no telemetry.</li>
    <li>
      Your history and tabs stay on your Mac. Passwords, passkeys and codes
      live in its keychain.
    </li>
    <li>
      Handoff can show the page you’re reading on your other Apple devices that
      use the same Apple Account.
    </li>
    <li>
      Artemis goes online to load the pages you open, to update its filter
      lists and to check for its own updates every 4 hours. When a site has no
      icon, Google’s icon service supplies one.
      Search suggestions and the leaked-password check also go online, and
      both are off until you turn them on.
    </li>
    <li>
      On-device intelligence is off until you turn it on, and it needs Apple
      Intelligence.
    </li>
  </ul>
</template>
