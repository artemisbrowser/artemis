    <p class="pt">What to sow in November</p>
    <p class="pd">Broad beans and garlic go in now. Most of the plot can rest until March.</p>
    <ul class="pl-list">
      <li><b>Broad beans.</b> Sow an autumn variety now for an early crop.</li>
      <li><b>Garlic.</b> Plant cloves 15&nbsp;cm apart, pointed end up.</li>
      <li><b>Sweet peas.</b> Sow in pots and keep them somewhere cool.</li>
    </ul>
  </div>
</article>
