<section
  class="sec shape cv"
  id="shape"
  data-name="Make it yours"
  aria-labelledby="shape-h"
>
  <div class="wrap">
    <header class="head" data-peek-summary>
      <h2 id="shape-h">Yours to shape.</h2>
      <p class="lede">
        Change how Artemis looks and behaves, down to the edge around the page.
      </p>
    </header>
    <div class="sh">
      <div class="sh-stage" aria-hidden="true">
        <div class="sh-rig">
          <div class="win-shadow"></div>
          <div
            class="win"
            data-space="0"
            data-accent="tide"
            data-sidebar="pinned"
            data-float="hidden"
            aria-hidden="true"
            inert
          >
            <div class="win-bd" data-host>
              <i class="lk" data-look="tide" data-top></i
              ><i class="lk sh-lk" data-look="ember"></i
              ><i class="lk sh-lk" data-look="aurora"></i
              ><i class="lk sh-lk" data-look="sunset"></i>
            </div>
            <div class="sb">
              <div class="sb-pin">
                <!-- @include _win/sidebar-top -->
                <!-- @include _win/favs -->
                <div class="pager">
                  <div class="strip"><!-- @include _win/panel-personal --></div>
                </div>
                <!-- @include _win/bottombar -->
              </div>
            </div>
            <div class="sh-bar">
              <span class="g circ"
                ><svg class="gl s14"><use href="#i-chev-l" /></svg></span
              ><span class="g circ"
                ><svg class="gl s14 b"><use href="#i-reload" /></svg
              ></span>
              <span class="sh-mid"
                ><span class="g circ"
                  ><svg class="gl s13 b"><use href="#i-link" /></svg></span
                ><span class="g url"
                  ><span class="dom">en.wikipedia.org</span></span
                ><span class="g circ"
                  ><svg class="gl tune"><use href="#i-tune" /></svg></span
              ></span>
            </div>
            <!-- @include _win/card -->
            <!-- @include _win/fsb -->
            <div class="cmd" data-state="typed" data-rows="1">
              <div class="cmd-row">
                <div class="cmd-field g-text">
                  <svg class="ico gl"><use href="#i-search" /></svg
                  ><span class="sh-q">!w Orion</span>
                </div>
              </div>
              <ul class="cmd-list">
                <li class="opt" aria-selected="true">
                  <span class="oi"
                    ><svg class="gl"><use href="#i-bang" /></svg></span
                  ><span class="ot">Wikipedia: Orion</span
                  ><span class="os"><span class="os-t">!w</span></span
                  ><span class="verb">Search<kbd class="kc sm">↵</kbd></span>
                </li>
              </ul>
            </div>
            <i class="rim"></i>
          </div>
          <svg class="sh-ptr" viewBox="0 0 14 21">
            <path d="M1 1v16l4-3.6 2.7 6.2 2.6-1.1-2.6-6H13Z" />
          </svg>
        </div>
        <div class="sh-icons">
          <b>App Icon</b>
          <picture
            ><source
              srcset="/assets/img/icon-rigel-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-rigel-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-aurora-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-aurora-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-hydrogenAlpha-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-hydrogenAlpha-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-oxygenIII-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-oxygenIII-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-neptune-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-neptune-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-mars-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-mars-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-betelgeuse-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-betelgeuse-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-io-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-io-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-moon-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-moon-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
          <picture
            ><source
              srcset="/assets/img/icon-cosmicLatte-dark-128.png"
              media="(prefers-color-scheme: dark)" />
            <img
              src="/assets/img/icon-cosmicLatte-light-128.png"
              width="128"
              height="128"
              alt=""
              loading="lazy"
          /></picture>
        </div>
        <span class="sh-read g-cap">Edge thickness</span>
      </div>
      <div class="sh-tabs" role="radiogroup" aria-label="What you can change">
        <label
          ><input type="radio" name="sh" id="sh-looks" checked />Looks<span
            class="sh-cap"
            >Give each space its own name, icon and colours.</span
          ></label
        >
        <label
          ><input type="radio" name="sh" id="sh-icon" />App icon<span
            class="sh-cap"
            >Pick the icon that shows in the Dock, ⌘Tab and Finder.</span
          ></label
        >
        <label
          ><input type="radio" name="sh" id="sh-edge" />Edge thickness<span class="sh-cap"
            >Set the edge around the page anywhere from 16 points to none.</span
          ></label
        >
        <label
          ><input type="radio" name="sh" id="sh-side" />Sidebar<span
            class="sh-cap"
            >Hide it, then choose how near the edge to point and how soon it
            slides out.</span
          ></label
        >
        <label
          ><input type="radio" name="sh" id="sh-bar" />Toolbar<span
            class="sh-cap"
            >Rather have the address on top? Press ⇧⌘D.</span
          ></label
        >
        <label
          ><input type="radio" name="sh" id="sh-bang" />Bangs<span
            class="sh-cap"
            >Type “!w orion” to search Wikipedia directly, or add bangs of your own.</span
          ></label
        >
      </div>
    </div>
    <p class="sh-more">
      Also in Settings: where new splits open, whether idle panes dim, and web
      extensions like your password manager.
    </p>
  </div>
</section>
