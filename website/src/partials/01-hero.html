<section class="hero" id="top" data-name="Overview" aria-labelledby="h1">
  <div class="wrap hero-head">
    <h1 id="h1">Artemis</h1>
    <p class="hero-tag">A native, private Mac browser you can make your own.</p>
    <div class="hero-get">
      <a class="pill" id="hero-get" data-get href="/download"
        ><span class="get-label">Download for Mac</span></a
      >
      <p class="fine">
        <!-- @stage -->macOS 26 or later, M1 or newer.<!-- @price -->
      </p>
    </div>
  </div>
  <div class="hero-film">
    <video data-stage src="/assets/video/laptop.mp4" poster="/assets/video/laptop.webp" width="1920" height="1080" muted playsinline preload="auto" aria-hidden="true"></video>
  </div>
  <div class="gallery hero-gallery reveal" data-gallery data-autoplay>
    <ul class="gallery-track" aria-label="Highlights">
      <li class="slide a-oxygen">
        <div class="slide-copy">
          <h2>Spaces</h2>
          <p>Room for everything.</p>
        </div>
        <button class="more" type="button" data-peek="spaces">Learn more</button>
        <img class="light" src="/assets/img/framed/spaces.webp" width="2000" height="1208" alt="Artemis on a laptop with the sidebar open beside a page" fetchpriority="high" />
        <img class="dark" src="/assets/img/framed/spaces-dark.webp" width="2000" height="1208" alt="Artemis on a laptop with the sidebar open beside a page" loading="lazy" decoding="async" />
      </li>
      <li class="slide a-betel">
        <div class="slide-copy">
          <h2>Themes</h2>
          <p>Every space, its own colour.</p>
        </div>
        <button class="more" type="button" data-peek="themes">Learn more</button>
        <img src="/assets/img/framed/themes.webp" width="2000" height="1208" alt="The theme editor open over an article" loading="lazy" decoding="async" />
      </li>
      <li class="slide a-io">
        <div class="slide-copy">
          <h2>Recent tabs</h2>
          <p>Hold ⌃⇥. Flip right back.</p>
        </div>
        <button class="more" type="button" data-peek="tabs">Learn more</button>
        <img src="/assets/img/framed/recent.webp" width="2000" height="1208" alt="The recent tabs switcher showing four pages" loading="lazy" decoding="async" />
      </li>
    </ul>
    <div class="gallery-ctl">
      <div class="dotnav"><ul class="dots" role="tablist" aria-label="Highlights"></ul></div>
      <button class="playpause" type="button" aria-label="Pause the highlights">
        <svg class="ico" aria-hidden="true"><use href="#i-pause" /></svg>
      </button>
    </div>
  </div>
</section>
