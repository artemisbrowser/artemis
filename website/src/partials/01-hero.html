<section
  class="track track-oow"
  id="top"
  data-name="Overview"
  aria-labelledby="h1"
>
  <div class="hero-copy">
    <h1 id="h1">A native browser for&nbsp;your&nbsp;Mac.</h1>
    <div class="hero-row">
      <p class="lede">
        Your tabs live down the side, grouped into spaces, and everything opens
        from the command bar.
      </p>
      <div class="get-block">
        <a class="get" id="hero-get" data-get href="/download"
          ><span class="get-well"
            ><picture
              ><source
                srcset="/assets/img/icon-rigel-light-96.png"
                media="(prefers-color-scheme: light)" />
              <img
                src="/assets/img/icon-rigel-dark-96.png"
                width="44"
                height="44"
                alt="" /></picture></span
          ><span class="get-label">Download for Mac</span></a
        >
        <p class="fine"><!-- @stage -->Needs macOS 26 or later.<!-- @price --></p>
        <!-- @unsigned -->
      </div>
    </div>
  </div>
  <div class="stage">
    <div
      class="rig"
      data-rig="oow"
      role="img"
      aria-label="The Artemis window. Tabs run down the left side, and a night-sky page about the constellation Orion fills the rest."
    >
      <div class="win-shadow"></div>
      <div
        class="win"
        data-space="0"
        data-sidebar="pinned"
        data-float="hidden"
        aria-hidden="true"
        inert
      >
        <div class="win-bd" data-host>
          <i class="lk" data-look="tide" data-top></i><i class="lk"></i>
        </div>
        <div class="sb">
          <div class="sb-pin">
            <!-- @include _win/sidebar-top -->
            <!-- @include _win/favs -->
            <div class="pager">
              <div class="strip"><!-- @include _win/panel-personal --></div>
            </div>
            <!-- @include _win/bottombar -->
          </div>
        </div>
        <!-- @include _win/card -->
        <!-- @include _win/fsb -->
        <i class="rim"></i>
      </div>
    </div>
    <!-- @include 02-oow-stage -->
  </div>
</section>
