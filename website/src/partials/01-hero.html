<section class="hero" id="top" data-name="Overview" aria-labelledby="h1">

      <p class="hero-tag">A sidebar browser for your Mac. Spaces, Peek and split view, with ads blocked from the first page.</p>

    <div class="hero-film">

      >

  </div>
