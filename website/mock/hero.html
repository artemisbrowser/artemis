<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero Lid Scroll</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #f5f5f7; font: 17px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  .scroll { height: 260vh; }
  .pin { position: sticky; top: 0; height: 100vh; overflow: clip; }
  .stage, .still { position: absolute; inset: 0; width: 100%; height: 100%; }
  .still { object-fit: contain; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .head { position: absolute; inset: 0 0 auto; z-index: 1; display: flex; justify-content: space-between; align-items: end; max-width: 1440px; margin: 0 auto; padding: 72px 90px 0; box-sizing: border-box; }
  h1 { margin: 0; font-size: clamp(56px, 9vw, 112px); line-height: 1; letter-spacing: -0.03em; }
  .get { text-align: right; }
  .pill { display: inline-block; padding: 12px 22px; border-radius: 980px; background: #0071e3; color: #fff; text-decoration: none; }
  .fine { margin: 10px 0 0; font-size: 12px; color: #86868b; }
  .after { padding: 144px 90px; max-width: 1440px; margin: 0 auto; box-sizing: border-box; background: #1d1d1f; }
  .after h2 { margin: 0; font-size: 48px; }
  .capture .scroll { height: 100vh; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<section class="scroll">
  <div class="pin">
    <div class="head" id="head">
      <h1>Artemis</h1>
      <div class="get">
        <a class="pill" href="#">Download for Mac</a>
        <p class="fine">macOS 26 or later, M1 or newer.</p>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</section>
<section class="after"><h2>Get to know Artemis.</h2></section>
<script type="module">
  const q = new URLSearchParams(location.search);
  const capture = q.has("capture");
  const stage = document.getElementById("stage");
  const head = document.getElementById("head");
  const scroll = stage.closest(".scroll");
  const gl = document.createElement("canvas").getContext("webgl2");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (capture) document.documentElement.classList.add("capture");
  // the headline fades out over the first quarter of the lid's travel
  const fade = (p) => { head.style.opacity = String(Math.max(0, 1 - p * 4)); };
  if (!capture && (!gl || reduced || innerWidth < 834)) {
    stage.innerHTML = '<img class="still" src="../src/img/framed/spaces.webp" alt="Artemis on a laptop" />';
  } else {
    const { mount } = await import("./laptop.js");
    await mount(stage, { screen: q.get("screen") || "spaces", capture, shot: "hero" });
    if (capture) {
      const render = window.render3d;
      window.render3d = (p, t) => { fade(p); render(p, t); };
    } else {
      addEventListener("scroll", () => {
        const r = scroll.getBoundingClientRect();
        fade(Math.min(1, Math.max(0, -r.top / (r.height - innerHeight))));
      }, { passive: true });
    }
  }
</script>
</body>
</html>
