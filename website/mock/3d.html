<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Laptop 3D</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #f5f5f7; font: 17px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  .scroll { height: 400vh; }
  .pin { position: sticky; top: 0; height: 100vh; overflow: clip; }
  canvas, .still { display: block; width: 100%; height: 100%; }
  .still { object-fit: contain; }
  .capture .scroll { height: 100vh; }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
<div class="scroll">
  <div class="pin" id="pin"></div>
</div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const capture = q.has("capture");
  const pin = document.getElementById("pin");
  const gl = document.createElement("canvas").getContext("webgl2");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (capture) document.documentElement.classList.add("capture");
  if (!capture && (!gl || reduced || innerWidth < 834)) {
    pin.innerHTML = '<img class="still" src="../src/img/framed/spaces.webp" alt="Artemis on a laptop" />';
  } else {
    new IntersectionObserver(async ([e], io) => {
      if (!e.isIntersecting) return;
      io.disconnect();
      (await import("./laptop.js")).mount(pin, { screen: q.get("screen") || "spaces", capture, shot: q.get("shot") || "orbit", finish: q.get("finish") || "black" });
    }).observe(pin);
  }
</script>
</body>
</html>
